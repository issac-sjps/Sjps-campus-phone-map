  { key: 'g1', label: '一年級', cssClass: 'cat-grade', match: t => /^1\d\d$/.test(t) },
  { key: 'g2', label: '二年級', cssClass: 'cat-grade', match: t => /^2\d\d$/.test(t) },
  { key: 'g3', label: '三年級', cssClass: 'cat-grade', match: t => /^3\d\d$/.test(t) },
  { key: 'g4', label: '四年級', cssClass: 'cat-grade', match: t => /^4\d\d$/.test(t) },
  { key: 'g5', label: '五年級', cssClass: 'cat-grade', match: t => /^5\d\d$/.test(t) },
  { key: 'g6', label: '六年級', cssClass: 'cat-grade', match: t => /^6\d\d$/.test(t) },
  { key: 'sub', label: '科任教師', cssClass: 'cat-sub', match: t => t.startsWith('科任') },
  { key: 'subst', label: '代課教師', cssClass: 'cat-subst', match: t => t.startsWith('代課') },
  { key: 'sp1', label: '特教-資優班教師', cssClass: 'cat-sp1', match: t => t.startsWith('資優') },
  { key: 'sp2', label: '特教-資源班教師', cssClass: 'cat-sp2', match: t => t.startsWith('資源') },
  // 專任輔導教師要在下面的「教學支援人員」規則（t.startsWith('專任')）之前比對，
  // 否則會被那條更寬的規則搶走。
  { key: 'sp3', label: '特教-專任輔導教師', cssClass: 'cat-sp3', match: t => t.startsWith('專任輔導') },
  { key: 'sp4', label: '特教-專任助理員', cssClass: 'cat-sp4', match: t => t.startsWith('專任特教助理') },
  { key: 'kinder', label: '幼兒園', cssClass: 'cat-kinder', match: t => t.startsWith('幼兒') || t.startsWith('學前') },
  // 「教學支援人員」現在改成明確規則，只抓教學/語言相關的支援人員（教支人員＊語），
  // 不再是保底分類。外籍教師、特教專任助理員已各自獨立成類，排除在這條規則外。
  { key: 'support', label: '教學支援人員', cssClass: 'cat-support', match: t => t.startsWith('教支') || t.startsWith('專任') },
  { key: 'foreign', label: '外籍教師', cssClass: 'cat-foreign', match: t => t.startsWith('外籍教師') },
  // 保底分類：護理師、營養師、幹事、技工、委外、人事助理…等不屬於教學支援的人，
  // 全部落在這裡。這個規則一定要留在比對順序的最後一個（符合任何職稱）。
  { key: 'adminSupport', label: '行政支援人員', cssClass: 'cat-adminsupport', match: t => true }
];

// 顯示順序跟比對順序分開處理：比對順序（CAT_ORDER 本身的排列）決定「這個人歸類到哪個類別」，
// 其中「行政支援人員」是保底規則（符合任何職稱），一定要留在比對順序的最後一個，
// 否則它會搶走後面規則更明確的類別。
// 這裡的 DISPLAY_ORDER 只決定畫面上標題列的排列順序，可以自由調整不影響比對邏輯。
const DISPLAY_ORDER_KEYS = [
  'admin','group','g1','g2','g3','g4','g5','g6','sub','subst','sp1','sp2','sp3','sp4','kinder','support','foreign','adminSupport'
];
const DISPLAY_ORDER = DISPLAY_ORDER_KEYS.map(k => CAT_ORDER.find(c => c.key === k)).filter(Boolean);

function getCategory(title) {
  for (const cat of CAT_ORDER) if (cat.match(title)) return cat;
  return CAT_ORDER[CAT_ORDER.length - 1];
}

// Split a flat list (rows + category headers) into `numCols` columns as evenly
// as possible. If a column would naturally end with a category header (with no
// rows under it in that column — its rows got pushed into the next column),
// that header is moved to the start of the next column instead. This shift is
// purely local to that one boundary: each column's end is computed as
// start + colSize from its own (possibly-shifted) start, so a 1-row nudge at
// one boundary does NOT cascade into a larger row count in later columns.
function distributeIntoColumns(flat, numCols) {
  const total = flat.length;
  const colSize = Math.ceil(total / numCols);
  const cols = [];
  let start = 0;
  for (let c = 0; c < numCols; c++) {
    let end = c === numCols - 1 ? total : Math.min(start + colSize, total);
    if (c < numCols - 1 && end > start && end < total && flat[end - 1] && flat[end - 1].isCat) {
      end -= 1; // don't strand a lone header at the bottom of this column
    }
    cols.push(flat.slice(start, end));
    start = end;
  }
  return cols;
}

// ─── 6 欄列高強制對齊 ────────────────────────────────────────
// phone-tbody-0 ~ phone-tbody-5 是 6 個各自獨立的 <table>，同一「列序」
// (第 N 列) 分散在不同欄的內容不同，實際渲染高度可能因字型 metrics、
// 邊框圓角、瀏覽器差異而有零星的 1px 落差，肉眼看起來就是「列高不整齊」。
// 這裡在每次 renderPhone 之後，逐列比較 6 欄中對應列的實際高度，
// 取最大值後統一寫回每一欄的那一列，讓格線在視覺上完全對齊。
function syncPhoneRowHeights() {
  const tbodies = [];
  for (let i = 0; i < 6; i++) {
    const el = document.getElementById(`phone-tbody-${i}`);
    if (el) tbodies.push(el);
  }
  if (!tbodies.length) return;

  // 先清掉先前設定的行內高度，讓每一列先以「自然高度」重新計算，
  // 否則舊的高度值會一直累積、越同步越高。
  tbodies.forEach(tb => {
    Array.from(tb.children).forEach(tr => { tr.style.height = ''; });
  });

  const maxRows = Math.max(...tbodies.map(tb => tb.children.length));
  for (let r = 0; r < maxRows; r++) {
    let max = 0;
    const rowsAtIndex = [];
    tbodies.forEach(tb => {
      const tr = tb.children[r];
      if (tr) {
        rowsAtIndex.push(tr);
        if (tr.offsetHeight > max) max = tr.offsetHeight;
      }
    });
    rowsAtIndex.forEach(tr => { tr.style.height = max + 'px'; });
  }
}
window.syncPhoneRowHeights = syncPhoneRowHeights;

// ─── 動態字體自適應 ──────────────────────────────────────
// 不同電腦的瀏覽器縮放比例／字型度量不同，同一段文字實際渲染出來的寬度
// 可能比欄位還寬。與其讓文字溢出蓋到隔壁欄（會變成重疊的亂碼），這裡改成
// 「量測實際需要的寬度，太寬就一點一點縮小字體」，縮到 MIN_FONT_SIZE
// 還是放不下才交給 CSS 的 text-overflow:ellipsis 兜底（絕對不會重疊）。
const AUTOFIT_MAX = 12;   // px，跟 CSS 預設的 12px 一致
const AUTOFIT_MIN = 8;    // px，字太小會看不清楚，縮到這裡就停止改用省略號
const AUTOFIT_MIN_EXT = 6.5; // px，分機是等寬數字，縮更小還是看得清楚，優先讓「兩個分機」也能完整顯示
const AUTOFIT_STEP = 0.5; // px，每次縮小的幅度

// 同一欄（同一個 table 裡的「職稱」欄／「姓名」欄／「分機」欄）統一用同一個字體
// 大小，而不是每一格各自判斷 —— 逐格獨立判斷會出現「內容看起來差不多長，但
// 縮放結果不一樣」的不一致情況（量測時機、瀏覽器 subpixel 差異都可能造成）。
// 改成：整欄裡最長的那一格決定這一欄要縮到多小，其餘格子跟著用同一個大小，
// 確保同一欄內視覺一致，也保證欄內最長的內容一定放得下。
//
// getMeasureEl 可以指定「量測寬度時要看哪個子元素」而不是整個 td——分機欄
// 的刪除按鈕（✕）平常是隱藏的，只有滑鼠移過去才出現，它的寬度不會隨字體
// 縮放而變小，混進 td 的 scrollWidth 一起量測會讓判斷失準，所以分機欄改成
// 只量測包住數字的 <span class="ext-text">，不把按鈕算進去。
function autoFitColumnGroup(cells, minSize, getMeasureEl) {
  if (!cells.length) return;
  const measure = getMeasureEl || (c => c);
  cells.forEach(c => { c.style.fontSize = ''; });
  const fits = () => cells.every(c => { const m = measure(c); return m.scrollWidth <= c.clientWidth + 0.5; });
  if (fits()) return;
  let size = AUTOFIT_MAX;
  let guard = 0;
  while (!fits() && size > minSize && guard < 40) {
    size -= AUTOFIT_STEP;
    cells.forEach(c => { c.style.fontSize = size + 'px'; });
    guard++;
  }
}

function collectCol(tbody, nth) {
  return Array.from(tbody.querySelectorAll(`tr:not(.cat-header) > td:nth-child(${nth})`));
}

function autoFitPhoneTable() {
  // 改成「整個頁面」統一計算一個大小，而不是每個 table（畫面上並排的 6 欄）
  // 各自獨立判斷 —— 之前每個 table 各自根據自己欄內最長的內容縮放，會導致
  // 同一頁面不同區塊（左邊表格 vs 右邊表格）算出不同的字體大小，看起來忽大忽小。
  // 現在把 6 個 table 的同類型欄位（職稱／姓名／分機）全部合併在一起量測，
  // 取全頁面最長的那筆內容決定縮到多小，讓整個頁面視覺上完全一致。
  const allTitle = [], allName = [], allExt = [];
  for (let i = 0; i < 6; i++) {
    const tbody = document.getElementById(`phone-tbody-${i}`);
    if (!tbody) continue;
    allTitle.push(...collectCol(tbody, 2));
    allName.push(...collectCol(tbody, 3));
    allExt.push(...collectCol(tbody, 4));
  }
  autoFitColumnGroup(allTitle, AUTOFIT_MIN);
  autoFitColumnGroup(allName, AUTOFIT_MIN);
  autoFitColumnGroup(allExt, AUTOFIT_MIN_EXT, c => c.querySelector('.ext-text') || c);
}
window.autoFitPhoneTable = autoFitPhoneTable;

// ─── Header 動態縮放 ──────────────────────────────────────
// header-top 裡的校名／學年徽章／分頁按鈕／搜尋列全部都是固定 px 尺寸，
// 只有到了 900px / 640px 斷點才會「跳一次」改版面，中間的寬度或瀏覽器
// 縮放比例改變時不會跟著平滑縮小。這裡改用 CSS variable --hscale
// （header 內大部份尺寸都已經改成 calc(基準值 * var(--hscale))），
// 量測目前 header-top 的內容是否放得下，放不下就整體調降這個比例，
// 讓文字、間距、按鈕大小同步平滑縮小，不用等到斷點才改版。
const HEADER_SCALE_MIN = 0.72;
const HEADER_SCALE_STEP = 0.05;
function autoFitHeader() {
  const header = document.querySelector('header');
  const bar = document.querySelector('.header-top');
  if (!header || !bar) return;
  // 手機版（900px 以下）header-left 會自動換行，不需要這套水平縮放邏輯
  if (window.innerWidth <= 900) {
    header.style.setProperty('--hscale', 1);
    return;
  }
  let scale = 1;
  header.style.setProperty('--hscale', scale);
  // scrollWidth 在下一個 frame 才會反映新的 --hscale，用同步量測＋逐步調整即可
  let guard = 0;
  while (bar.scrollWidth > bar.clientWidth + 1 && scale > HEADER_SCALE_MIN && guard < 20) {
    scale = Math.max(HEADER_SCALE_MIN, scale - HEADER_SCALE_STEP);
    header.style.setProperty('--hscale', scale);
    guard++;
  }
}
window.autoFitHeader = autoFitHeader;
autoFitHeader();
window.addEventListener('load', autoFitHeader);
window.addEventListener('resize', () => {
  clearTimeout(window._headerFitTimer);
  window._headerFitTimer = setTimeout(autoFitHeader, 100);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(autoFitHeader);
}
if (typeof ResizeObserver !== 'undefined') {
  document.addEventListener('DOMContentLoaded', () => {
    const bar = document.querySelector('.header-top');
    if (!bar) return;
    const ro = new ResizeObserver(() => {
      clearTimeout(window._headerROTimer);
      window._headerROTimer = setTimeout(autoFitHeader, 60);
    });
    ro.observe(bar);
  });
}

// 視窗縮放或字型延遲載入完成時，重新量測一次（避免初次量測時字型還沒套用）
window.addEventListener('resize', () => {
  clearTimeout(window._phoneRowSyncTimer);
  window._phoneRowSyncTimer = setTimeout(() => { autoFitPhoneTable(); syncPhoneRowHeights(); }, 150);
});
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { autoFitPhoneTable(); syncPhoneRowHeights(); });
}

// ─── ResizeObserver：不管是縮放、捲軸出現、字型延遲套用…任何原因造成
// 欄寬改變，都會被這裡抓到並重新量測，比只監聽 window resize 更可靠
// （原本只在初次 renderPhone 當下量測一次，若那個當下版面還沒完全穩定
// ── 例如稍後才出現垂直捲軸 ── 量到的寬度就會跟最終畫面對不起來）。
if (typeof ResizeObserver !== 'undefined') {
  let _phoneGridRO;
  document.addEventListener('DOMContentLoaded', () => {
    const grid = document.getElementById('phone-grid');
    if (!grid) return;
    _phoneGridRO = new ResizeObserver(() => {
      clearTimeout(window._phoneGridROTimer);
      window._phoneGridROTimer = setTimeout(() => { autoFitPhoneTable(); syncPhoneRowHeights(); }, 60);
    });
    _phoneGridRO.observe(grid);
  });
}

// ─── Phone render ─────────────────────────────────────────
window.renderPhone = function(filter = '') {
  const data = APP.phoneData;
  const q = filter.trim().toLowerCase();
  const filtered = q ? data.filter(r =>
    r.name.toLowerCase().includes(q) ||
    r.title.toLowerCase().includes(q) ||
    r.ext.includes(q)
  ) : data;

  // Build ordered flat list with category headers
  const groups = {};
  filtered.forEach(r => {
    const cat = getCategory(r.title);
    if (!groups[cat.key]) groups[cat.key] = { label: cat.label, key: cat.key, rows: [] };
    groups[cat.key].rows.push(r);
  });

  // Flatten: [{isCat, label, key, cssClass} | {row data}]
  // The displayed "#" is a live, always-contiguous sequence number computed here
  // (not the stored record id), so it always matches "how many people so far"
  // and never has gaps no matter how records were added/deleted over time.
  const flat = [];
  let _seq = 0;
  DISPLAY_ORDER.forEach(cat => {
    const hasRows = groups[cat.key] && groups[cat.key].rows.length;
    const count = hasRows ? groups[cat.key].rows.length : 0;
    // 編輯模式下，即使類別目前沒有人也顯示標題列，這樣才有地方可以拖曳放入；
    // 一般瀏覽模式仍然隱藏空類別，避免畫面出現空空的標題造成混亂。
    if (!hasRows && !APP.editMode) return;
    flat.push({ isCat: true, label: cat.label, key: cat.key, cssClass: cat.cssClass, count });
    if (hasRows) groups[cat.key].rows.forEach(r => flat.push({ isCat: false, ...r, _seq: ++_seq }));
  });

  // Distribute evenly across 6 columns, without letting a lone category
  // header at a column boundary balloon the next column's row count.
  const cols = distributeIntoColumns(flat, 6);

  function rowHtml(item) {
    if (item.isCat) {
      return `<tr class="cat-header ${item.cssClass || ''}" ondragover="event.preventDefault()" ondrop="dropPersonOnCategory(event,'${item.key}')">
        <td colspan="3">${item.label}<span class="cat-count">(${item.count})</span></td>
        <td style="text-align:right;padding-right:6px">
          <button class="cat-add-btn" onclick="addRowInCat('${item.key}')">＋</button>
        </td>
      </tr>`;
    }
    const isStar = item.name.startsWith('★');
    const rawName = isStar ? item.name.slice(1) : item.name;
    // 姓名欄完整顯示，不再截斷字數（欄寬已加大並允許換行）
    const displayName = isStar ?
      `<span class="star">★</span>${rawName}` : rawName;
    // # 欄改為即時計算的流水號（依畫面順序重新編號），不再顯示寫死的 id，
    // 這樣就不會因為資料新增/刪除而跳號，且永遠等於「目前算到第幾位」。
    const idDisplay = isStar ? '★' : item._seq;
    // 星星要跟姓名欄的 ★ 同色（accent 橘黃色），非星星時維持原本淡灰色
    const idStyle = isStar
      ? 'color:var(--accent);font-size:10px;line-height:1;'
      : 'color:var(--text-light);font-size:12px;line-height:1;';
    const titleAttr = ` title="${String(item.title).replace(/"/g,'&quot;')}"`;
    const extTitleAttr = ` title="${String(item.ext).replace(/"/g,'&quot;')}"`;
    const draggableAttr = APP.editMode ? ' draggable="true" ondragstart="dragStartPerson(event,\'' + item.id + '\')" ondragover="event.preventDefault()" ondrop="dropPersonOnRow(event,\'' + item.id + '\')"' : '';
    return `<tr data-id="${item.id}"${draggableAttr}>
      <td class="id-col id-star-cell" onclick="toggleStar('${item.id}')" style="${idStyle}"${isStar ? titleAttr : ' title="編輯模式下可標記學年主任"'}>${idDisplay}</td>
      <td class="editable" onclick="editCell(this,'title')"${titleAttr}>${item.title}</td>
      <td class="name-col editable copy-name" data-raw-name="${rawName.replace(/"/g,'&quot;')}" data-record-id="${item.id}" title="${rawName.replace(/"/g,'&quot;')}" onclick="handleNameClick(event,this)">${displayName}</td>
      <td class="ext-col editable" onclick="editCell(this,'ext')"${extTitleAttr}><span class="ext-text">${item.ext}</span><button class="person-del-btn" onclick="deletePerson(event,'${item.id}')" title="刪除此人">✕</button></td>
    </tr>`;
  }

  cols.forEach((col, i) => {
    const el = document.getElementById(`phone-tbody-${i}`);
    if (el) el.innerHTML = col.map(rowHtml).join('');
  });

  // 6 個欄位是各自獨立的 <table>，CSS 的 height:23px 只是「理想值」，
  // 不同瀏覽器 / 字型渲染下實際列高可能有 1px 內的差異，導致視覺上不整齊。
  // 這裡在渲染完成後，逐一比對「同一列序」在 6 個欄位中的實際高度，
  // 取最大值統一設定，強制讓每一列在跨欄時都完全對齊。
  autoFitPhoneTable();
  syncPhoneRowHeights();

  const total2 = filtered.length;
  document.getElementById('phone-count').textContent = `共 ${total2} 筆${q ? '（篩選中）' : ''}`;
  if (APP.phoneLastEdit) document.getElementById('last-edit-phone').textContent = '最後編輯：' + APP.phoneLastEdit;

  // Extension→teacher lookup for the map tab depends on phoneData, so keep it fresh
  window.renderMap && window.APP.mapData && window._mapNeedsRefresh !== false && null;
};

window.filterPhone = function() {
  renderPhone(document.getElementById('phone-search').value);
};

// Click name: edit-mode → edit cell; view-mode → copy name
window.handleNameClick = function(e, td) {
  if (APP.editMode) {
    editCell(td, 'name');
  } else {
    const name = td.dataset.rawName || td.textContent.replace('★','').trim();
    navigator.clipboard.writeText(name).then(() => {
      showToast(`✅ 已複製「${name}」`);
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = name; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(`✅ 已複製「${name}」`);
    });
  }
};

window.toggleStar = function(id) {
  if (!APP.editMode) return;
  const record = APP.phoneData.find(r => String(r.id) === String(id));
  if (!record) return;
  if (record.name.startsWith('★')) {
    record.name = record.name.slice(1);
  } else {
    record.name = '★' + record.name;
  }
  APP.pendingChanges = true;
  renderPhone(document.getElementById('phone-search').value);
};

// ─── Inline cell edit ─────────────────────────────────────
window.editCell = function(td, field) {
  if (!APP.editMode) return;
  if (td.querySelector('input')) return;
  const row = td.closest('tr');
  const id = row.dataset.id;
  const record = APP.phoneData.find(r => String(r.id) === String(id));
  if (!record) return;
  const orig = record[field];
  const val = field === 'name' && orig.startsWith('★') ? orig.slice(1) : orig;
  td.innerHTML = `<input class="inline-edit" value="${val}" onblur="commitCell(this,'${id}','${field}')" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value='${val}';this.blur();}">`;
  td.querySelector('input').focus();
  APP.pendingChanges = true;
};

window.commitCell = function(input, id, field) {
  const record = APP.phoneData.find(r => String(r.id) === String(id));
  if (record) record[field] = input.value.trim();
  renderPhone(document.getElementById('phone-search').value);
  // ext/name changes affect the map tab's teacher-name matching
  if ((field === 'ext' || field === 'name') && document.getElementById('panel-map').classList.contains('active')) {
    renderMap();
  }
};

window.addRow = function() {
  const newId = String(Math.max(...APP.phoneData.map(r => parseInt(r.id) || 0)) + 1);
  APP.phoneData.push({ id: newId, title: '新職稱', name: '姓名', ext: '000' });
  APP.pendingChanges = true;
  renderPhone();
};

// ─── Drag a person row onto a category header to move them ────
// 類別是由 title 欄位判斷的（例如 "科任教師"、"301"），所以搬移的做法
// 是把該筆記錄的 title 改成目標類別的代表值。因為同一類別底下的 title
// 常常不完全相同（例如各年級班級的房號不同），改之前會先跳出確認視窗，
// 讓你可以調整成正確的職稱／班級代碼，而不是被亂猜的值蓋掉。
window.dragStartPerson = function(e, id) {
  if (!APP.editMode) { e.preventDefault(); return; }
  e.dataTransfer.setData('text/plain', String(id));
  e.dataTransfer.effectAllowed = 'move';
};

window.dropPersonOnCategory = function(e, catKey) {
  e.preventDefault();
  if (!APP.editMode) return;
  const id = e.dataTransfer.getData('text/plain');
  if (!id) return;
  const record = APP.phoneData.find(r => String(r.id) === String(id));
  const cat = CAT_ORDER.find(c => c.key === catKey);
  if (!record || !cat) return;
  if (cat.match(record.title)) return; // 已經在這個類別了

  const suggestion = APP.phoneData.find(r => cat.match(r.title))?.title || cat.label;
  const newTitle = prompt(`將「${record.name.replace('★','')}」搬移到「${cat.label}」\n請確認／調整職稱或班級代碼：`, suggestion);
  if (newTitle === null || !newTitle.trim()) return;
  record.title = newTitle.trim();
  APP.pendingChanges = true;
  renderPhone(document.getElementById('phone-search').value);
};

// ─── Drag a person row onto another person row：插入到該筆的位置排序 ────
// 拖曳的這筆資料會被移到目標那筆的前面，原本卡在那個位置往後的人（含目標本人）
// 全部自動往後遞補一位——這樣就能像你想的「把72移到65的位置，其他往後」。
// 如果拖過去的目標剛好在不同類別，會先跳出確認視窗調整職稱／班級代碼，
// 一次同時處理「搬類別」跟「排序位置」。
window.dropPersonOnRow = function(e, targetId) {
  e.preventDefault();
  e.stopPropagation();
  if (!APP.editMode) return;
  const id = e.dataTransfer.getData('text/plain');
  if (!id || String(id) === String(targetId)) return;
  const fromIdx = APP.phoneData.findIndex(r => String(r.id) === String(id));
  const toIdx = APP.phoneData.findIndex(r => String(r.id) === String(targetId));
  if (fromIdx < 0 || toIdx < 0) return;
  const dragged = APP.phoneData[fromIdx];
  const target = APP.phoneData[toIdx];

  const draggedCat = getCategory(dragged.title);
  const targetCat = getCategory(target.title);
  if (draggedCat.key !== targetCat.key) {
    const newTitle = prompt(`將「${dragged.name.replace('★','')}」搬移到「${targetCat.label}」\n請確認／調整職稱或班級代碼：`, target.title);
    if (newTitle === null || !newTitle.trim()) return;
    dragged.title = newTitle.trim();
  }

  // 先移除拖曳的那筆，再插入到目標（重新找一次目標目前的位置，因為移除動作可能讓索引位移）前面
  APP.phoneData.splice(fromIdx, 1);
  let insertIdx = APP.phoneData.findIndex(r => String(r.id) === String(targetId));
  if (insertIdx < 0) insertIdx = APP.phoneData.length;
  APP.phoneData.splice(insertIdx, 0, dragged);

  APP.pendingChanges = true;
  renderPhone(document.getElementById('phone-search').value);
};

window.deletePerson = function(e, id) {
  e.stopPropagation();
  if (!APP.editMode) return;
  const record = APP.phoneData.find(r => String(r.id) === String(id));
  if (!record) return;
  const displayName = record.name.startsWith('★') ? record.name.slice(1) : record.name;
  if (!confirm(`確定刪除「${displayName}（${record.title}）」這筆資料？`)) return;
  APP.phoneData = APP.phoneData.filter(r => String(r.id) !== String(id));
  APP.pendingChanges = true;
  renderPhone(document.getElementById('phone-search').value);
};

window.addRowInCat = function(catKey) {
  if (!APP.editMode) return;
  // Find the last row of this category to insert after it
  const cat = CAT_ORDER.find(c => c.key === catKey);
  if (!cat) return;
  // Find insertion index: after last matching item
  let insertAfter = -1;
  APP.phoneData.forEach((r, i) => { if (cat.match(r.title)) insertAfter = i; });
  const newId = String(Math.max(...APP.phoneData.map(r => parseInt(r.id) || 0)) + 1);
  // Use the category's typical title as default
  const defaultTitle = APP.phoneData.find(r => cat.match(r.title))?.title || cat.label;
  const newRow = { id: newId, title: defaultTitle, name: '姓名', ext: '000' };
  if (insertAfter >= 0) {
    APP.phoneData.splice(insertAfter + 1, 0, newRow);
  } else {
    APP.phoneData.push(newRow);
  }
  APP.pendingChanges = true;
  renderPhone();
  // Focus on the new row's name cell after render
  setTimeout(() => {
    const row = document.querySelector(`tr[data-id="${newId}"] td.name-col`);
    if (row) row.click();
  }, 50);
};

// ─── Map render ───────────────────────────────────────────
const BNAMES = { A: '新莊樓', B: '至美樓', F: '至誠樓', C: '至善樓', Z: '至真樓', X: '其他' };

// Floor order storage: APP.floorOrder[b] = ['5F','4F','3F','2F','1F',...]
function getFloorOrder(b) {
  if (!APP.floorOrder) APP.floorOrder = {};
  if (!APP.floorOrder[b]) {
    // First time: just use the keys as-is from mapData (no auto-sort)
    APP.floorOrder[b] = Object.keys(APP.mapData[b] || {});
  }
  // Always ensure all existing floors are included (in case new ones were added)
  const existing = Object.keys(APP.mapData[b] || {});
  existing.forEach(f => {
    if (!APP.floorOrder[b].includes(f)) APP.floorOrder[b].push(f);
  });
  return APP.floorOrder[b];
}

// Build a lookup of extension number -> teacher/staff name(s) from the phone list.
// Multiple staff can share one extension (e.g. an office line), so this maps to an array.
function buildExtNameMap() {
  const map = {};
  (APP.phoneData || []).forEach(r => {
    if (!r.ext) return;
    const name = r.name.startsWith('★') ? r.name.slice(1) : r.name;
    // A single record's ext field is normally one number, but split defensively
    // in case it was entered like "213,214"
    r.ext.split(/[\s,、\n]+/).filter(Boolean).forEach(num => {
      if (!map[num]) map[num] = [];
      if (!map[num].includes(name)) map[num].push(name);
    });
  });
  return map;
}

window.renderMap = function() {
  const b = APP.currentBuilding;
  if (!APP.mapData[b]) APP.mapData[b] = {};
  const isRotated = false;
  const sortedFloors = getFloorOrder(b)
    .filter(f => APP.mapData[b][f] !== undefined);

  const extNameMap = buildExtNameMap();

  function roomCardHtml(room, floor, idx) {
    const typeClass = room.type === 'class' ? 'has-class' : room.type === 'office' ? 'has-office' : room.type === 'other' ? 'has-other' : 'has-special';
    const dragAttrs = `draggable="true" ondragstart="dragStart(event,'${b}','${floor}',${idx})" ondragover="dragOver(event)" ondrop="dropRoom(event,'${b}','${floor}',${idx})" ondragend="dragEnd(event)"`;
    const extNums = room.ext ? room.ext.split(/[\s,、\n]+/).filter(Boolean) : [];
    const extHtml = extNums.length > 0
      ? `<div class="room-ext-grid">${extNums.map(n => {
          const names = extNameMap[n];
          const joined = names && names.length ? names.join('／') : '';
          const tooltipText = joined ? `☎${n} ${joined}` : `☎${n}`;
          const nameHtml = joined ? `<span class="ext-name">${joined}</span>` : '';
          return `<span class="room-ext-item" title="${tooltipText.replace(/"/g,'&quot;')}"><span class="ext-num">☎${n}</span>${nameHtml}</span>`;
        }).join('')}</div>`
      : '';
    return `<div class="room-card ${typeClass}" ${dragAttrs} onclick="openRoomEdit('${b}','${floor}',${idx})">
      <div class="room-name">${room.name || '（未命名）'}</div>
      ${room.code ? `<div class="room-code">${room.code}</div>` : ''}
      ${extHtml}
      <button class="room-del-btn" onclick="deleteRoom(event,'${b}','${floor}',${idx})" title="刪除">✕</button>
    </div>`;
  }

  function floorSectionHtml(floor, rooms, floorIdx) {
    const addBtn = `<button class="add-room-btn" onclick="addRoom('${b}','${floor}')">＋ 新增</button>`;
    const delFloorBtn = `<button class="del-floor-btn" onclick="deleteFloor('${b}','${floor}')" title="刪除此樓層">🗑</button>`;
    const renameBtn = `<button class="rename-floor-btn" onclick="renameFloor('${b}','${floor}')" title="重新命名樓層">✎</button>`;
    const upBtn = floorIdx > 0
      ? `<button class="move-floor-btn" onclick="moveFloor('${b}','${floor}',-1)" title="往上移">↑</button>` : '';
    const downBtn = floorIdx < sortedFloors.length - 1
      ? `<button class="move-floor-btn" onclick="moveFloor('${b}','${floor}',1)" title="往下移">↓</button>` : '';
    return `<div class="floor-section" ondragover="dragOver(event)" ondrop="dropRoom(event,'${b}','${floor}',999)">
      <div class="floor-label"><span class="floor-drag-handle">${floor}</span>
        <span class="floor-actions">${upBtn}${downBtn} ${renameBtn} ${addBtn} ${delFloorBtn}</span>
      </div>
      <div class="rooms-grid">${rooms.map((r,i) => roomCardHtml(r,floor,i)).join('')}</div>
    </div>`;
  }

  let html = `<div class="building-title">${BNAMES[b]}
    <button class="add-floor-btn" onclick="addFloor('${b}')">＋ 新增樓層</button>
  </div>`;

  sortedFloors.forEach((floor, floorIdx) => {
    html += floorSectionHtml(floor, APP.mapData[b][floor] || [], floorIdx);
  });

  document.getElementById('building-map').innerHTML = html;
  if (APP.mapLastEdit) document.getElementById('last-edit-map').textContent = '最後編輯：' + APP.mapLastEdit;
};

window.switchBuilding = function(b, el) {
  APP.currentBuilding = b;
  if (!APP.mapData[b]) APP.mapData[b] = {};
  document.querySelectorAll('.btab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  // Clear search when switching building
  const si = document.getElementById('map-search-input');
  if (si) si.value = '';
  document.getElementById('map-search-count') && (document.getElementById('map-search-count').textContent = '');
  renderMap();
};

// ─── Map search ───────────────────────────────────────────
window.searchMap = function(q) {
  q = q.trim().toLowerCase();
  const cards = document.querySelectorAll('#building-map .room-card');
  const countEl = document.getElementById('map-search-count');

  if (!q) {
    cards.forEach(c => { c.classList.remove('map-match','map-dim'); });
    if (countEl) countEl.textContent = '';
    return;
  }

  let matchCount = 0;
  cards.forEach(c => {
    const text = c.textContent.toLowerCase();
    const isMatch = text.includes(q);
    c.classList.toggle('map-match', isMatch);
    c.classList.toggle('map-dim', !isMatch);
    if (isMatch) matchCount++;
  });

  if (countEl) countEl.textContent = matchCount > 0 ? `找到 ${matchCount} 間` : '找不到';

  // Auto-switch building if no match here but found elsewhere
  if (matchCount === 0) {
    const allBuildings = ['F','B','C','Z','A','X'];
    for (const bkey of allBuildings) {
      if (bkey === APP.currentBuilding) continue;
      const bdata = APP.mapData[bkey] || {};
      for (const floor of Object.keys(bdata)) {
        for (const room of (bdata[floor] || [])) {
          const text = [room.name, room.code, room.ext].join(' ').toLowerCase();
          if (text.includes(q)) {
            // Found in another building — switch to it
            const btab = [...document.querySelectorAll('.btab')].find(t => t.onclick?.toString().includes(`'${bkey}'`));
            if (btab) { btab.click(); }
            else {
              APP.currentBuilding = bkey;
              renderMap();
            }
            // Re-run highlight after render
            setTimeout(() => searchMap(q), 50);
            return;
          }
        }
      }
    }
  }
};

// ─── Add floor ────────────────────────────────────────────
window.addFloor = function(b) {
  if (!APP.editMode) return;
  const name = prompt('新樓層名稱（例：6F、地下室、屋頂）：');
  if (!name || !name.trim()) return;
  const key = name.trim();
  if (APP.mapData[b][key]) { alert('此樓層已存在'); return; }
  APP.mapData[b][key] = [];
  getFloorOrder(b).push(key);
  APP.pendingChanges = true;
  renderMap();
};

// ─── Move floor up/down ───────────────────────────────────
window.moveFloor = function(b, floor, dir) {
  if (!APP.editMode) return;
  const order = getFloorOrder(b);
  const idx = order.indexOf(floor);
  if (idx < 0) return;
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= order.length) return;
  order.splice(idx, 1);
  order.splice(newIdx, 0, floor);
  APP.pendingChanges = true;
  renderMap();
};

// ─── Rename floor ─────────────────────────────────────────
window.renameFloor = function(b, floor) {
  if (!APP.editMode) return;
  const newName = prompt(`將「${floor}」重新命名為：`, floor);
  if (!newName || !newName.trim() || newName.trim() === floor) return;
  const key = newName.trim();
  if (APP.mapData[b][key]) { alert(`「${key}」已存在，請用其他名稱`); return; }
  APP.mapData[b][key] = APP.mapData[b][floor];
  delete APP.mapData[b][floor];
  const order = getFloorOrder(b);
  const idx = order.indexOf(floor);
  if (idx >= 0) order[idx] = key;
  APP.pendingChanges = true;
  renderMap();
};

// ─── Delete floor ─────────────────────────────────────────
window.deleteFloor = function(b, floor) {
  if (!APP.editMode) return;
  const rooms = APP.mapData[b][floor] || [];
  if (rooms.length > 0 && !confirm(`確定刪除「${floor}」及其 ${rooms.length} 間教室？`)) return;
  delete APP.mapData[b][floor];
  const order = getFloorOrder(b);
  const idx = order.indexOf(floor);
  if (idx >= 0) order.splice(idx, 1);
  APP.pendingChanges = true;
  renderMap();
};

// ─── Delete room ──────────────────────────────────────────
window.deleteRoom = function(e, b, floor, idx) {
  e.stopPropagation();
  if (!APP.editMode) return;
  const room = APP.mapData[b][floor][idx];
  if (!confirm(`確定刪除「${room.name || '此教室'}」？`)) return;
  APP.mapData[b][floor].splice(idx, 1);
  APP.pendingChanges = true;
  renderMap();
};

// ─── Drag and drop ────────────────────────────────────────
APP._drag = null;

window.dragStart = function(e, b, floor, idx) {
  if (!APP.editMode) { e.preventDefault(); return; }
  APP._drag = { b, floor, idx };
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.style.opacity = '0.4';
};
window.dragEnd = function(e) {
  e.currentTarget.style.opacity = '';
};
window.dragOver = function(e) {
  if (!APP.editMode || !APP._drag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
};
window.dropRoom = function(e, targetB, targetFloor, targetIdx) {
  e.preventDefault();
  e.stopPropagation();
  if (!APP._drag) return;
  const { b: srcB, floor: srcFloor, idx: srcIdx } = APP._drag;
  APP._drag = null;
  if (srcB === targetB && srcFloor === targetFloor && srcIdx === targetIdx) return;

  // 一對一互換
  if (!APP.mapData[targetB][targetFloor]) APP.mapData[targetB][targetFloor] = [];

  if (targetIdx >= APP.mapData[targetB][targetFloor].length) {
    // 拖到空白區域（＋按鈕上）→ 移到最後
    const room = APP.mapData[srcB][srcFloor].splice(srcIdx, 1)[0];
    APP.mapData[targetB][targetFloor].push(room);
  } else {
    // 互換兩個位置
    const srcRoom = APP.mapData[srcB][srcFloor][srcIdx];
    const tgtRoom = APP.mapData[targetB][targetFloor][targetIdx];
    APP.mapData[targetB][targetFloor][targetIdx] = srcRoom;
    APP.mapData[srcB][srcFloor][srcIdx] = tgtRoom;
  }

  APP.pendingChanges = true;
  renderMap();
};

// ─── Print renderers ──────────────────────────────────────
function buildPhonePrint() {
  const data = APP.phoneData;
  const year = APP.currentYear;
  const lastEdit = APP.phoneLastEdit || '';

  // Group into categories, ordered by DISPLAY_ORDER (same order as the on-screen view)
  const groupsByKey = {};
  data.forEach(r => {
    const cat = getCategory(r.title);
    if (!groupsByKey[cat.key]) groupsByKey[cat.key] = { label: cat.label, key: cat.key, cssClass: cat.cssClass, rows: [] };
    groupsByKey[cat.key].rows.push(r);
  });
  const groups = DISPLAY_ORDER.map(cat => groupsByKey[cat.key]).filter(Boolean);

  // Flatten into rows with category headers
  const allRows = [];
  groups.forEach(g => {
    if (!g.rows.length) return;
    allRows.push({ isCat: true, label: g.label, cssClass: g.cssClass, count: g.rows.length });
    g.rows.forEach(r => allRows.push({ isCat: false, ...r }));
  });

  // Split into 6 columns as evenly as possible, same logic as the on-screen view
  const cols = distributeIntoColumns(allRows, 6);

  function colHtml(rows) {
    if (!rows.length) return '';
    let h = `<table><thead><tr><th>#</th><th>職稱</th><th>姓名</th><th>分機</th></tr></thead><tbody>`;
    rows.forEach(r => {
      if (r.isCat) {
        h += `<tr class="p-cat ${r.cssClass || ''}"><td colspan="4">${r.label}(${r.count})</td></tr>`;
      } else {
        const isStar = r.name.startsWith('★');
        const nameHtml = isStar ? `<span class="p-star">★</span>${r.name.slice(1)}` : r.name;
        h += `<tr><td>${r.id}</td><td>${r.title}</td><td>${nameHtml}</td><td class="p-ext">${r.ext}</td></tr>`;
      }
    });
    h += `</tbody></table>`;
    return h;
  }

  return `
    <div class="print-header">
      <h1>新莊國小 ${year}學年度 教職員工分機一覽表</h1>
      <p>★ 學年主任　　最後更新：${lastEdit || '—'}</p>
    </div>
    <div id="phone-print-grid">
      <div>${colHtml(cols[0])}</div>
      <div>${colHtml(cols[1])}</div>
      <div>${colHtml(cols[2])}</div>
      <div>${colHtml(cols[3])}</div>
      <div>${colHtml(cols[4])}</div>
      <div>${colHtml(cols[5])}</div>
    </div>`;
}

function buildMapPrint() {
  const year = APP.currentYear;
  const lastEdit = APP.mapLastEdit || '';
  const bnames = { A: '新莊樓', B: '至美樓', F: '至誠樓', C: '至善樓', Z: '至真樓', X: '其他' };
  const extNameMap = buildExtNameMap();
  let html = '';

  ['F','B','C','Z','A','X'].forEach(bkey => {
    const bdata = APP.mapData[bkey] || {};
    if (!Object.keys(bdata).length) return; // skip empty buildings

    // Use stored floor order
    const floors = (APP.floorOrder && APP.floorOrder[bkey])
      ? APP.floorOrder[bkey].filter(f => bdata[f] && bdata[f].length)
      : Object.keys(bdata).filter(f => bdata[f] && bdata[f].length);
    if (!floors.length) return;

    html += `<div class="map-print-page">
      <div class="map-print-title">新莊國小 ${year}學年度 場地配置圖 — ${bnames[bkey]}</div>`;

    floors.forEach(floor => {
      const rooms = bdata[floor];
      html += `<div class="map-print-floor">
        <div class="map-print-floor-label">${floor}</div>
        <div class="map-print-rooms">`;
      rooms.forEach(room => {
        const tc = room.type === 'class' ? 'has-class'
          : room.type === 'office' ? 'has-office'
          : room.type === 'other' ? 'has-other'
          : 'has-special';
        const extNums = room.ext ? room.ext.split(/[\s,、\n]+/).filter(Boolean) : [];
        const extDisplay = extNums.map(n => {
          const names = extNameMap[n];
          return names && names.length ? `${n}(${names.join('／')})` : n;
        }).join('、');
        html += `<div class="map-print-room ${tc}">
          <div class="r-name">${room.name}</div>
          ${room.code ? `<div class="r-code">${room.code}</div>` : ''}
          ${extDisplay ? `<div class="r-ext">☎ ${extDisplay}</div>` : ''}
        </div>`;
      });
      html += `</div></div>`;
    });

    html += `<div style="font-size:9px;color:#999;margin-top:4mm;text-align:right">最後更新：${lastEdit || '—'}</div>
    </div>`;
  });
  return html;
}

// Hook into browser print event to inject print layout
window.addEventListener('beforeprint', () => {
  document.getElementById('phone-print-root').innerHTML = buildPhonePrint();
  document.getElementById('map-print-root').innerHTML = buildMapPrint();
});
window.addEventListener('afterprint', () => {
  document.getElementById('phone-print-root').innerHTML = '';
  document.getElementById('map-print-root').innerHTML = '';
});

// ─── Room modal ───────────────────────────────────────────
window.openRoomEdit = function(building, floor, idx) {
  if (!APP.editMode) return;
  const room = APP.mapData[building][floor][idx];
  APP.editingRoomKey = { building, floor, idx };
  document.getElementById('modal-name').value = room.name;
  document.getElementById('modal-code').value = room.code || '';
  document.getElementById('modal-ext').value = room.ext || '';
  document.getElementById('modal-type').value = room.type || 'special';
  document.getElementById('room-modal').classList.add('visible');
};

window.closeModal = function() {
  document.getElementById('room-modal').classList.remove('visible');
};

window.saveRoom = function() {
  const { building, floor, idx } = APP.editingRoomKey;
  const roomData = {
    name: document.getElementById('modal-name').value.trim(),
    code: document.getElementById('modal-code').value.trim(),
    ext: document.getElementById('modal-ext').value.trim(),
    type: document.getElementById('modal-type').value
  };
  if (!APP.mapData[building][floor]) APP.mapData[building][floor] = [];
  if (idx === -1) {
    APP.mapData[building][floor].push(roomData);
  } else {
    APP.mapData[building][floor][idx] = { ...APP.mapData[building][floor][idx], ...roomData };
  }
  APP.pendingChanges = true;
  closeModal();
  renderMap();
};

window.addRoom = function(building, floor) {
  if (!APP.editMode) return;
  // Open modal; room is created on save
  APP.editingRoomKey = { building, floor, idx: -1 }; // -1 = new room
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-code').value = '';
  document.getElementById('modal-ext').value = '';
  document.getElementById('modal-type').value = 'special';
  document.getElementById('room-modal').classList.add('visible');
  setTimeout(() => document.getElementById('modal-name').focus(), 100);
};

// Close modal only when clicking directly on overlay background (not bubbled)
document.getElementById('room-modal').addEventListener('mousedown', function(e) {
  if (e.target === this) closeModal();
});

// ─── Edit mode ────────────────────────────────────────────
const EDIT_PASSWORD = '073411373';

window.toggleEdit = function() {
  if (!APP.editMode) {
    // Show password modal to enter edit mode
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-error').style.display = 'none';
    document.getElementById('pw-modal').classList.add('visible');
    setTimeout(() => document.getElementById('pw-input').focus(), 100);
  } else {
    _exitEditMode();
  }
};

function _enterEditMode() {
  APP.editMode = true;
  document.body.classList.add('edit-mode');
  document.getElementById('edit-btn').classList.add('active');
  document.getElementById('edit-label').textContent = '編輯中';
  document.getElementById('edit-bar').classList.add('visible');
  renderPhone(document.getElementById('phone-search').value);
}

function _exitEditMode() {
  APP.editMode = false;
  document.body.classList.remove('edit-mode');
  document.getElementById('edit-btn').classList.remove('active');
  document.getElementById('edit-label').textContent = '編輯';
  document.getElementById('edit-bar').classList.remove('visible');
  renderPhone(document.getElementById('phone-search').value);
}

window.checkPassword = function() {
  const val = document.getElementById('pw-input').value;
  if (val === EDIT_PASSWORD) {
    document.getElementById('pw-modal').classList.remove('visible');
    _enterEditMode();
  } else {
    const err = document.getElementById('pw-error');
    err.style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
};

window.closePwModal = function() {
  document.getElementById('pw-modal').classList.remove('visible');
};

window.discardEdit = function() {
  if (APP.pendingChanges && !confirm('確定要放棄所有未儲存的變更？')) return;
  APP.pendingChanges = false;
  _exitEditMode();
  // Reload from Firebase
  if (window._loadYear) window._loadYear(APP.currentYear);
};

window.saveAll = async function() {
  const btn = document.querySelector('#edit-bar .save-btn');
  btn.textContent = '儲存中…'; btn.disabled = true;
  const ok = await window._saveToFirebase(APP.currentYear);
  btn.textContent = '💾 儲存'; btn.disabled = false;
  if (ok) {
    APP.pendingChanges = false;
    _exitEditMode();
    showToast('✅ 已儲存');
  }
};

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:300;opacity:0;transition:opacity 0.3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 2500);
}

// ─── Tab switch ───────────────────────────────────────────
window.switchTab = function(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
  // Toggle search area (only on phone tab)
  const searchArea = document.getElementById('header-search-area');
  if (searchArea) searchArea.style.display = name === 'phone' ? 'flex' : 'none';
  // Toggle legend
  const legendPhone = document.getElementById('tab-legend-phone');
  const legendMap = document.getElementById('tab-legend-map');
  if (legendPhone) legendPhone.style.display = name === 'phone' ? 'flex' : 'none';
  if (legendMap) legendMap.style.display = name === 'map' ? 'flex' : 'none';
  // Ext→name matching depends on the latest phone data, so refresh on entering the map tab
  if (name === 'map') renderMap();
};

// ─── Year picker ──────────────────────────────────────────
window.toggleYearPicker = function() {
  const dd = document.getElementById('year-dropdown');
  dd.classList.toggle('visible');
  if (dd.classList.contains('visible')) renderYearList();
  document.addEventListener('click', closeYearPickerOutside, { once: true });
}

function closeYearPickerOutside(e) {
  const dd = document.getElementById('year-dropdown');
  const toggle = document.getElementById('year-toggle');
  if (!dd.contains(e.target) && !toggle.contains(e.target)) dd.classList.remove('visible');
}

function renderYearList() {
  const list = document.getElementById('year-list');
  list.innerHTML = APP.years.map(y =>
    `<div class="year-option ${y === APP.currentYear ? 'active' : ''}" onclick="selectYear(${y})">
      ${y}學年度 ${y === APP.currentYear ? '<span class="check">✓</span>' : ''}
    </div>`
  ).join('');
}

window.selectYear = function(y) {
  APP.currentYear = y;
  document.getElementById('current-year-label').textContent = y + '學年度';
  document.getElementById('year-dropdown').classList.remove('visible');
  if (window._loadYear) window._loadYear(y);
};

window.newYear = async function() {
  const next = Math.max(...APP.years) + 1;
  const confirmed = confirm(`建立 ${next}學年度？\n將複製 ${APP.currentYear}學年度的資料做為起點。`);
  if (!confirmed) return;

  const prevYears = APP.years.slice();
  APP.years.push(next);
  const fromYear = APP.currentYear;
  APP.currentYear = next;
  document.getElementById('current-year-label').textContent = next + '學年度';
  document.getElementById('year-dropdown').classList.remove('visible');

  // Data already loaded in memory from the year we're branching off — save it under
  // the new year's docs, AND persist the years list itself so it survives a refresh.
  const [dataOk, listOk] = await Promise.all([
    window._saveToFirebase(next),
    window._saveYearsList()
  ]);

  if (dataOk && listOk) {
    showToast(`✅ ${next}學年度已建立（複製自 ${fromYear}學年度）`);
  } else {
    // Roll back so the UI doesn't show a year that didn't actually save
    APP.years = prevYears;
    APP.currentYear = fromYear;
    document.getElementById('current-year-label').textContent = fromYear + '學年度';
  }
};

// ─── Export Excel ─────────────────────────────────────────
window.exportExcel = function() {
  if (typeof XLSX === 'undefined') { alert('Excel 套件載入中，請稍後再試'); return; }
  const data = [['編號','職稱','姓名','分機號碼']];
  APP.phoneData.forEach(r => data.push([r.id, r.title, r.name, r.ext]));
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{wch:6},{wch:16},{wch:10},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `${APP.currentYear}學年度分機`);
  XLSX.writeFile(wb, `新莊國小${APP.currentYear}學年度分機一覽表.xlsx`);
};

// ─── Export / Import JSON ─────────────────────────────────
window.exportJSON = function() {
  const payload = {
    year: APP.currentYear,
    exportedAt: new Date().toLocaleString('zh-TW', {timeZone:'Asia/Taipei'}),
    phone: APP.phoneData,
    map: APP.mapData,
    floorOrder: APP.floorOrder || {}
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sjps_${APP.currentYear}_data.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`✅ 已匯出 sjps_${APP.currentYear}_data.json`);
};

window.importJSON = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      // Validate structure
      if (!data.phone || !data.map) {
        alert('JSON 格式錯誤：缺少 phone 或 map 欄位');
        return;
      }
      const importYear = data.year || APP.currentYear;
      if (!confirm(`確定要用此 JSON 覆蓋 ${importYear}學年度的所有資料？\n（分機：${data.phone.length} 筆，場地：${Object.keys(data.map).length} 棟）`)) {
        e.target.value = ''; return;
      }
      APP.phoneData = data.phone;
      APP.mapData = data.map;
      APP.floorOrder = data.floorOrder || {};
      if (data.year && !APP.years.includes(data.year)) {
        APP.years.push(data.year);
      }
      APP.currentYear = importYear;
      document.getElementById('current-year-label').textContent = importYear + '學年度';
      APP.pendingChanges = true;
      renderPhone();
      renderMap();
      showToast(`✅ 匯入完成（${importYear}學年度），請記得儲存到 Firebase`);
    } catch(err) {
      alert('JSON 解析失敗：' + err.message);
    }
    e.target.value = ''; // reset file input
  };
  reader.readAsText(file);
};

// ─── Init ─────────────────────────────────────────────────
// Firebase module will call renderPhone + renderMap after loading
// Fallback if Firebase not available yet
setTimeout(() => {
  if (!APP.phoneData.length) {
    APP.phoneData = JSON.parse(JSON.stringify(APP.defaultPhone));
    APP.mapData = JSON.parse(JSON.stringify(APP.defaultMap));
    renderPhone();
    renderMap();
  }
}, 1500);
</script>
