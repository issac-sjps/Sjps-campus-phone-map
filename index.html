<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新莊國小 Campus Phone &amp; Map</title>
<style>
  :root {
    --primary: #1a5c8a;
    --primary-light: #e8f2f9;
    --primary-mid: #4a8db5;
    --accent: #e07b39;
    --accent-light: #fdf0e6;
    --success: #2e7d52;
    --success-light: #e8f5ee;
    --bg: #f5f7fa;
    --surface: #ffffff;
    --border: #dde3ea;
    --text: #1a2332;
    --text-muted: #5a6a7e;
    --text-light: #8a9ab0;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
    --radius: 8px;
    --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Header ── */
  header {
    background: var(--primary);
    color: #fff;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    --hscale: 1; /* JS 動態調整：header 內容放不下時整體縮小這個比例 */
  }
  .header-top {
    height: calc(36px * var(--hscale));
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: calc(12px * var(--hscale));
  }
  .header-left { display: flex; align-items: center; gap: calc(12px * var(--hscale)); flex-shrink: 1; min-width: 0; }
  .school-name { font-size: calc(15px * var(--hscale)); font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; flex-shrink: 0; }
  .year-badge {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    padding: calc(2px * var(--hscale)) calc(10px * var(--hscale));
    font-size: calc(12px * var(--hscale));
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    display: flex; align-items: center; gap: 4px;
    flex-shrink: 0;
    position: relative;
    white-space: nowrap;
  }
  .year-badge:hover { background: rgba(255,255,255,0.28); }

  /* Search bar embedded in header */
  .header-search {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 680px;
  }
  .header-search-wrap { position: relative; flex: 1; }
  .header-search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.6); width: 14px; height: 14px; }
  .header-search-input {
    width: 100%; padding: 4px 12px 4px 32px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    font-size: 13px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    outline: none;
    transition: all 0.15s;
  }
  .header-search-input::placeholder { color: rgba(255,255,255,0.6); }
  .header-search-input:focus { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.7); }
  .header-search-btn {
    display: flex; align-items: center; gap: 5px;
    padding: calc(3px * var(--hscale)) calc(12px * var(--hscale));
    border-radius: 16px;
    font-size: calc(12px * var(--hscale)); font-weight: 500;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.12);
    color: #fff;
    transition: all 0.15s; white-space: nowrap;
    flex-shrink: 0;
  }
  .header-search-btn:hover { background: rgba(255,255,255,0.22); }
  .header-search-btn svg { width: 13px; height: 13px; }

  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* Tabs — inline pill buttons in header */
  .tab {
    padding: calc(3px * var(--hscale)) calc(12px * var(--hscale));
    font-size: calc(13px * var(--hscale)); font-weight: 500;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 16px;
    transition: all 0.15s;
    display: flex; align-items: center; gap: 5px;
    user-select: none; white-space: nowrap;
    flex-shrink: 0;
  }
  .tab:hover { color: #fff; border-color: rgba(255,255,255,0.6); }
  .tab.active { color: #fff; background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.7); }

  .tab-legend {
    font-size: 11px; color: rgba(255,255,255,0.55);
    display: flex; align-items: center; gap: 8px;
  }
  .tab-legend span { display: flex; align-items: center; gap: 4px; }
  .tab-legend .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

  /* ── Map search ── */
  .map-search-bar {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px;
    box-shadow: var(--shadow);
  }
  .map-search-bar svg { width: 14px; height: 14px; color: var(--text-light); flex-shrink: 0; }
  .map-search-bar input {
    border: none; outline: none; flex: 1;
    font-size: 13px; background: transparent; color: var(--text);
  }
  .map-search-bar input::placeholder { color: var(--text-light); }
  #map-search-count { font-size: 11px; color: var(--text-muted); white-space: nowrap; }
  .room-card.map-match {
    box-shadow: 0 0 0 3px var(--accent), 0 4px 12px rgba(224,123,57,0.3) !important;
    transform: scale(1.05); z-index: 1; position: relative;
  }
  .room-card.map-dim { opacity: 0.22; }

  /* ── Map tab ── */
  /* Left sidebar + content layout */
  .map-layout { display: flex; gap: 10px; align-items: flex-start; }
  .map-sidebar {
    display: flex; flex-direction: column; gap: 4px;
    flex-shrink: 0; padding-top: 0;
  }
  .btab {
    padding: 8px 14px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1.5px solid var(--border); background: var(--surface);
    color: var(--text-muted); transition: all 0.15s;
    text-align: left; white-space: nowrap; min-width: 100px;
    display: block;
  }
  .btab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btab:hover:not(.active):not(.disabled) { border-color: var(--primary-mid); color: var(--primary); }
  .btab.disabled { color: var(--text-light); cursor: default; font-size: 11px; }
  .map-content { flex: 1; min-width: 0; }

  .building-map { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 14px; }
  #edit-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border: 1.5px solid rgba(255,255,255,0.5);
    background: transparent;
    color: #fff;
  }
  #edit-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.8); }
  #edit-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  #edit-btn svg { width: 14px; height: 14px; }

  /* Edit status bar */
  #edit-bar {
    display: none;
    background: var(--accent-light);
    border-bottom: 1px solid #f0c090;
    padding: 8px 24px;
    font-size: 13px;
    color: #b05010;
    align-items: center;
    gap: 8px;
  }
  #edit-bar.visible { display: flex; }
  #edit-bar .save-btn {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 5px 16px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
  }
  #edit-bar .save-btn:hover { background: #c06028; }
  #edit-bar .discard-btn {
    background: transparent;
    color: #b05010;
    border: 1px solid #f0c090;
    padding: 5px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }

  /* Edit button */
  main { max-width: 100%; margin: 0; padding: 14px 16px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Phone tab ── */
  .toolbar {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .search-wrap { position: relative; flex: 1; min-width: 200px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-light); width: 16px; height: 16px; }
  .search-input {
    width: 100%; padding: 8px 12px 8px 34px;
    border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 14px; background: var(--surface); color: var(--text);
    outline: none; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--primary); }
  .toolbar-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 7px 14px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); transition: all 0.15s; white-space: nowrap;
  }
  .toolbar-btn:hover { border-color: var(--primary-mid); color: var(--primary); }
  .toolbar-btn svg { width: 15px; height: 15px; }
  .toolbar-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .toolbar-btn.primary:hover { background: #154d76; }

  /* Phone table */
  .phone-table-wrap {
    background: var(--surface); border-radius: 0;
    box-shadow: var(--shadow); overflow: visible;
  }
  /* 5-column grid layout for phone table */
  .phone-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 0 1px;
    background: var(--border);
  }
  .phone-col {
    background: var(--surface);
    overflow: visible;
    min-width: 0;
  }
  .phone-col:first-child { border-radius: 0; }
  .phone-col:last-child  { border-radius: 0; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  thead th {
    background: var(--primary); color: #fff;
    padding: 3px 3px; text-align: left;
    font-size: 11px; font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  /* Fixed proportional column widths. Widened title/name columns and
     given the id column a touch more room so text isn't clipped. */
  .phone-col th:nth-child(1), .phone-col td:nth-child(1) { width: 10%; border-right: 1px dashed rgba(0,0,0,0.15); }
  .phone-col th:nth-child(2), .phone-col td:nth-child(2) { width: 32%; border-right: 1px dashed rgba(0,0,0,0.15); }
  .phone-col th:nth-child(3), .phone-col td:nth-child(3) { width: 26%; text-align: right; border-right: 1px dashed rgba(0,0,0,0.15); }
  .phone-col th:nth-child(4), .phone-col td:nth-child(4) { width: 32%; text-align: right; }
  /* 分類標題列（cat-header）是合併儲存格，虛線不適用，蓋掉避免視覺上斷斷續續 */
  .cat-header td { border-right: none !important; }
  /* Cells stay on a single line (no wrapping). Padding is halved so more
     of the column width goes to the text itself instead of to whitespace —
     matching the thin 1px gap between the phone-col divisions. Text that's
     still too long for its column overflows visibly rather than wrapping
     or being clipped with an ellipsis. */
  tbody tr { border-bottom: 1px solid #edf0f4; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--primary-light); }
  td { padding: 4px 3px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; height: 23px; line-height: 1.3; }
  td.id-col { color: var(--text-light); font-size: 12px; width: 28px; line-height: 1; }
  td.id-star-cell { cursor: default; }
  body.edit-mode td.id-star-cell { cursor: pointer; }
  body.edit-mode td.id-star-cell:hover { background: #fff8e1; }
  /* Copy name on click (view mode) */
  td.copy-name { cursor: copy; }
  body.edit-mode td.copy-name { cursor: pointer; }
  td.copy-name:hover { background: var(--primary-light); }
  td.copy-name:hover::after {
    content: '⎘';
    font-size: 10px; color: var(--primary-mid);
    margin-left: 3px; opacity: 0.7;
  }
  td.ext-col { font-weight: 700; color: var(--primary); font-family: monospace; font-size: 12px; white-space: nowrap; }
  td.name-col .star { color: var(--accent); font-size: 9px; margin-right: 1px; line-height: 1; display: inline-block; vertical-align: middle; }

  /* Editable cells */
  body.edit-mode tr[draggable="true"] { cursor: grab; }
  body.edit-mode tr[draggable="true"]:active { cursor: grabbing; }
  body.edit-mode .cat-header td { cursor: default; }
  .person-del-btn {
    display: none;
    background: none; border: none;
    color: #c0392b; font-size: 10px; cursor: pointer;
    padding: 0 3px; margin-left: 3px; border-radius: 3px; line-height: 1;
    vertical-align: middle;
  }
  body.edit-mode tr:hover .person-del-btn { display: inline-block; }
  .person-del-btn:hover { background: #fde8e8; }
  body.edit-mode td.editable { cursor: pointer; position: relative; }
  body.edit-mode td.editable:hover { background: #fff8e1; }
  .inline-edit {
    width: 100%; border: 1.5px solid var(--accent); border-radius: 3px;
    padding: 2px 4px; font-size: 12px; background: #fffdf8;
    outline: none; font-family: inherit;
  }

  /* Category group header */
  .cat-header td {
    background: var(--primary-light);
    color: var(--primary);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 4px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    height: 23px;
    line-height: 1.3;
  }
  .cat-count {
    font-weight: 500;
    opacity: 0.65;
    margin-left: 1px;
    letter-spacing: 0;
  }
  /* Distinct color per category group so they're easy to scan.
     All six grade levels (1~6年級) share one color since they're all
     homeroom teachers — the same kind of role. */
  .cat-header.cat-admin   td { background: #dbe8f2; color: #12496e; }
  .cat-header.cat-group   td { background: #fbe2cc; color: #a2531b; }
  .cat-header.cat-grade   td { background: #d8ecdf; color: #1f6b45; }
  .cat-header.cat-sub     td { background: #e5ddf5; color: #5b3a9e; }
  .cat-header.cat-subst   td { background: #faf0cf; color: #92700a; }
  .cat-header.cat-sp1     td { background: #fbdde2; color: #a5324c; }
  .cat-header.cat-sp2     td { background: #f8cdd6; color: #922a44; }
  .cat-header.cat-sp3     td { background: #f5bcc8; color: #7e1f39; }
  .cat-header.cat-sp4     td { background: #f2acba; color: #6a152e; }
  .cat-header.cat-kinder  td { background: #d7eef4; color: #146a80; }
  .cat-header.cat-support td { background: #e6e6e9; color: #4d4d55; }
  .cat-header.cat-foreign td { background: #d9e7de; color: #2b6b4a; }
  .cat-header.cat-adminsupport td { background: #f5e3da; color: #96431e; }
  .cat-add-btn {
    display: none;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 11px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  body.edit-mode .cat-add-btn { display: inline-block; }
  body.edit-mode .cat-add-btn:hover { background: #154d76; }

  /* Add row button */
  .add-row-btn {
    display: none;
    width: 100%; padding: 10px;
    background: none; border: none;
    color: var(--primary); font-size: 13px;
    cursor: pointer; text-align: center;
  }
  body.edit-mode .add-row-btn { display: block; }
  .add-row-btn:hover { background: var(--primary-light); }

  /* Footer meta */
  .meta-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px; font-size: 12px; color: var(--text-light);
    padding: 0 4px;
  }

  /* ── Map tab continued ── */
  /* Rotated layout for 新莊樓 */
  .rotated-map {
    display: flex;
    gap: 6px;
    align-items: flex-start;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .rotated-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 96px;
  }
  .rotated-floor-label {
    font-size: 11px; font-weight: 700; color: #fff;
    background: var(--primary);
    border-radius: 5px; padding: 4px 8px;
    text-align: center; letter-spacing: 0.06em;
    margin-bottom: 2px;
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
  }

  /* Delete room button */
  .room-del-btn {
    display: none;
    position: absolute; top: 2px; right: 3px;
    background: none; border: none;
    color: #c0392b; font-size: 10px; cursor: pointer;
    padding: 1px 3px; border-radius: 3px; line-height: 1;
  }
  body.edit-mode .room-del-btn { display: block; }
  .room-del-btn:hover { background: #fde8e8; }

  /* Delete floor button */
  .del-floor-btn {
    display: none;
    background: none; border: none;
    color: #c0392b; font-size: 11px; cursor: pointer;
    padding: 1px 4px; border-radius: 3px; opacity: 0.7;
  }
  body.edit-mode .del-floor-btn { display: inline-block; }
  .del-floor-btn:hover { opacity: 1; background: #fde8e8; }

  .rename-floor-btn {
    display: none;
    background: none; border: none;
    color: var(--primary); font-size: 12px; cursor: pointer;
    padding: 1px 5px; border-radius: 3px; opacity: 0.7;
  }
  body.edit-mode .rename-floor-btn { display: inline-block; }
  .rename-floor-btn:hover { opacity: 1; background: var(--primary-light); }

  .move-floor-btn {
    display: none;
    background: none; border: 1px solid var(--border);
    color: var(--text-muted); font-size: 11px; cursor: pointer;
    padding: 1px 5px; border-radius: 3px; line-height: 1.4;
  }
  body.edit-mode .move-floor-btn { display: inline-block; }
  body.edit-mode .move-floor-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary-mid); }

  /* Add floor button */
  .add-floor-btn {
    display: none;
    margin-left: 10px;
    background: var(--primary-light); color: var(--primary);
    border: 1px solid var(--primary-mid); border-radius: 5px;
    font-size: 11px; font-weight: 500; cursor: pointer;
    padding: 3px 10px;
  }
  body.edit-mode .add-floor-btn { display: inline-block; }
  .add-floor-btn:hover { background: var(--primary); color: #fff; }

  /* Floor label actions */
  .floor-actions { display: flex; align-items: center; gap: 4px; margin-left: 8px; }

  /* Drag styles */
  .room-card { position: relative; }
  body.edit-mode .room-card { cursor: grab; }
  body.edit-mode .room-card:active { cursor: grabbing; }
  .room-card.drag-over { border-color: var(--accent) !important; background: #fffdf8 !important; }
  .building-title { font-size: 15px; font-weight: 600; color: var(--primary); margin-bottom: 12px; }
  .floor-section { margin-bottom: 12px; }
  .floor-label {
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    letter-spacing: 0.06em; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .floor-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .rooms-grid { display: flex; flex-wrap: wrap; gap: 5px; }

  /* Color legend bar */
  .map-legend {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 10px; padding: 7px 12px;
    background: var(--surface); border-radius: var(--radius);
    box-shadow: var(--shadow); font-size: 11px;
  }
  .map-legend span {
    display: flex; align-items: center; gap: 5px;
    color: var(--text-muted); font-weight: 500;
  }
  .legend-dot {
    width: 12px; height: 12px; border-radius: 3px;
    display: inline-block; flex-shrink: 0;
  }

  .room-card {
    border: 2px solid var(--border); border-radius: 7px;
    padding: 5px 7px;
    width: 128px;
    background: var(--surface); cursor: default;
    transition: all 0.15s; position: relative;
    flex-shrink: 0; box-sizing: border-box;
    overflow: hidden;
  }
  /* Full colored border per type */
  .room-card.has-class  { border-color: var(--primary);   background: #f0f5fa; }
  .room-card.has-office { border-color: var(--accent);    background: #fdf3ec; }
  .room-card.has-special{ border-color: var(--success);   background: #eef7f2; }
  .room-card.has-other  { border-color: #7c5cbf;          background: #f3f0fa; }

  .room-name { font-size: 11px; font-weight: 600; color: var(--text); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .room-code { font-size: 10px; color: var(--text-light); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Ext list: one line per extension, with matched teacher name if found */
  .room-ext-grid {
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-top: 3px;
  }
  .room-ext-item {
    font-size: 10px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.5;
    cursor: help;
  }
  .room-ext-item .ext-num { font-family: monospace; }
  .room-ext-item .ext-name { font-weight: 500; margin-left: 3px; opacity: 0.9; }
  .room-card.has-class   .room-ext-item { color: var(--primary); }
  .room-card.has-office  .room-ext-item { color: #a04010; }
  .room-card.has-special .room-ext-item { color: var(--success); }
  .room-card.has-other   .room-ext-item { color: #7c5cbf; }

  body.edit-mode .room-card { cursor: pointer; }
  body.edit-mode .room-card:hover { opacity: 0.82; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

  /* Add room button (edit mode) */
  .add-room-btn {
    display: none;
    border: 2px dashed var(--border); border-radius: 7px;
    padding: 5px 7px; width: 128px;
    background: none; color: var(--text-light);
    font-size: 11px; cursor: pointer; transition: all 0.15s;
    flex-shrink: 0; box-sizing: border-box;
    min-height: 68px; align-items: center; justify-content: center;
  }
  body.edit-mode .add-room-btn { display: flex; }
  body.edit-mode .add-room-btn:hover { border-color: var(--accent); color: var(--accent); background: #fffdf8; }

  /* Room edit modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.4); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 24px; width: 340px; max-width: 90vw;
    box-shadow: var(--shadow-md);
  }
  .modal h3 { font-size: 16px; margin-bottom: 16px; color: var(--primary); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 5px; }
  .form-group input {
    width: 100%; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; outline: none; transition: border-color 0.15s;
    font-family: inherit;
  }
  .form-group input:focus { border-color: var(--primary); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-actions button {
    padding: 7px 18px; border-radius: 6px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border);
  }
  .btn-save { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn-cancel { background: var(--surface); color: var(--text-muted); }

  /* Year picker dropdown */
  .year-dropdown {
    display: none; position: absolute;
    top: calc(100% + 6px); left: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 8px;
    box-shadow: var(--shadow-md); z-index: 150; min-width: 140px;
    color: var(--text); cursor: default;
  }
  .year-dropdown.visible { display: block; }
  .year-option {
    padding: 8px 12px; border-radius: 6px; font-size: 14px;
    cursor: pointer; transition: background 0.1s;
    display: flex; align-items: center; justify-content: space-between;
  }
  .year-option:hover { background: var(--primary-light); color: var(--primary); }
  .year-option.active { font-weight: 600; color: var(--primary); }
  .year-option .check { color: var(--primary); font-size: 12px; }
  .year-new { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 4px; }
  .year-new .year-option { color: var(--text-muted); font-size: 13px; }

  /* Last edited */
  #last-edit-phone, #last-edit-map { font-size: 11px; color: var(--text-light); }

  /* Print styles */
  @media print {
    @page { size: A4 landscape; margin: 10mm 8mm; }

    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    header, .tabs, .toolbar, .edit-bar, .meta-bar, .modal-overlay,
    #pw-modal, #room-modal, .add-row-btn { display: none !important; }
    body { background: #fff; font-size: 11px; }
    main { padding: 0; max-width: 100%; }

    /* Show only the active panel */
    .tab-panel { display: none !important; }
    .tab-panel.active { display: block !important; }

    /* ── Phone print: 3-column layout like original ── */
    #panel-phone .phone-table-wrap { box-shadow: none; border: none; }
    #panel-phone { }

    .print-header {
      text-align: center; margin-bottom: 6mm;
    }
    .print-header h1 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .print-header p { font-size: 11px; color: #555; }

    /* Split phone data into 3 columns */
    #phone-print-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr;
      gap: 0 2mm;
      width: 100%;
    }
    #phone-print-grid table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10px;
      break-inside: avoid-column;
    }
    #phone-print-grid table thead th {
      background: #1a5c8a !important;
      color: #fff !important;
      padding: 3px 5px;
      font-size: 10px;
      font-weight: 600;
      border: 1px solid #1a5c8a;
    }
    #phone-print-grid table tbody tr { border-bottom: 1px solid #e0e0e0; }
    #phone-print-grid table tbody td { padding: 2.5px 5px; vertical-align: middle; }
    #phone-print-grid .p-cat td {
      background: #dde8f0 !important;
      font-size: 9px; font-weight: 700;
      padding: 2px 5px; color: #1a5c8a;
    }
    #phone-print-grid .p-cat.cat-admin   td { background: #dbe8f2 !important; color: #12496e; }
    #phone-print-grid .p-cat.cat-group   td { background: #fbe2cc !important; color: #a2531b; }
    #phone-print-grid .p-cat.cat-grade   td { background: #d8ecdf !important; color: #1f6b45; }
    #phone-print-grid .p-cat.cat-sub     td { background: #e5ddf5 !important; color: #5b3a9e; }
    #phone-print-grid .p-cat.cat-subst   td { background: #faf0cf !important; color: #92700a; }
    #phone-print-grid .p-cat.cat-sp1     td { background: #fbdde2 !important; color: #a5324c; }
    #phone-print-grid .p-cat.cat-sp2     td { background: #f8cdd6 !important; color: #922a44; }
    #phone-print-grid .p-cat.cat-sp3     td { background: #f5bcc8 !important; color: #7e1f39; }
    #phone-print-grid .p-cat.cat-sp4     td { background: #f2acba !important; color: #6a152e; }
    #phone-print-grid .p-cat.cat-kinder  td { background: #d7eef4 !important; color: #146a80; }
    #phone-print-grid .p-cat.cat-support td { background: #e6e6e9 !important; color: #4d4d55; }
    #phone-print-grid .p-cat.cat-foreign td { background: #d9e7de !important; color: #2b6b4a; }
    #phone-print-grid .p-cat.cat-adminsupport td { background: #f5e3da !important; color: #96431e; }
    #phone-print-grid .p-ext { font-weight: 700; color: #1a5c8a; font-family: monospace; }
    #phone-print-grid .p-star { color: #c0560a; font-weight: 700; }

    /* Hide screen phone table in print */
    #panel-phone .phone-table-wrap,
    #panel-phone .toolbar { display: none !important; }
    #phone-print-root { display: block !important; }

    /* ── Map print ── */
    #panel-map .map-sidebar,
    #panel-map .map-layout > .map-sidebar { display: none !important; }
    #map-print-root { display: block !important; }
    #building-map { display: none !important; }

    .map-print-page { page-break-after: always; }
    .map-print-page:last-child { page-break-after: avoid; }
    .map-print-title { font-size: 14px; font-weight: 700; text-align: center; margin-bottom: 4mm; color: #1a5c8a; }
    .map-print-floor { margin-bottom: 4mm; }
    .map-print-floor-label {
      font-size: 10px; font-weight: 700; color: #1a5c8a;
      border-bottom: 1.5px solid #1a5c8a; margin-bottom: 2mm; padding-bottom: 1mm;
    }
    .map-print-rooms { display: flex; flex-wrap: wrap; gap: 2mm; }
    .map-print-room {
      border: 1.5px solid #bbb; border-radius: 3px; padding: 2mm 3mm;
      min-width: 22mm; font-size: 9px; line-height: 1.4;
    }
    .map-print-room.has-class  { border-color: #1a5c8a; background: #f0f5fa !important; }
    .map-print-room.has-office { border-color: #e07b39; background: #fdf3ec !important; }
    .map-print-room.has-special{ border-color: #2e7d52; background: #eef7f2 !important; }
    .map-print-room.has-other  { border-color: #7c5cbf; background: #f3f0fa !important; }
    .map-print-room .r-name { font-weight: 600; }
    .map-print-room .r-code { color: #888; font-size: 8px; }
    .map-print-room .r-ext  { font-weight: 700; font-size: 9px; }
    .map-print-room.has-class   .r-ext { color: #1a5c8a; }
    .map-print-room.has-office  .r-ext { color: #a04010; }
    .map-print-room.has-special .r-ext { color: #2e7d52; }
    .map-print-room.has-other   .r-ext { color: #7c5cbf; }
  }
  /* Hidden on screen, shown on print */
  #phone-print-root { display: none; }
  #map-print-root { display: none; }

  /* ══════════════════════ Responsive (tablet / mobile) ══════════════════════ */
  @media (max-width: 900px) {
    header { padding: 8px 10px; }
    .header-top {
      height: auto;
      flex-wrap: wrap;
      row-gap: 8px;
      padding: 2px 0;
    }
    .header-left { flex-wrap: wrap; row-gap: 6px; width: 100%; }
    .school-name { font-size: 13px; }
    .tab-legend { display: none !important; }
    .header-search {
      order: 5; width: 100%; max-width: none;
      flex-wrap: wrap; row-gap: 6px;
    }
    .header-search-wrap { flex-basis: 100%; width: 100%; }
    .header-right { width: 100%; justify-content: flex-end; order: 4; }

    main { padding: 10px 10px 24px; }

    /* Map layout: sidebar becomes a horizontal scroll strip above content */
    .map-layout { flex-direction: column; }
    .map-sidebar {
      flex-direction: row; flex-wrap: nowrap;
      overflow-x: auto; -webkit-overflow-scrolling: touch;
      width: 100%; padding-bottom: 4px; gap: 6px;
    }
    .btab { min-width: auto; flex-shrink: 0; }

    /* Phone table: collapse the 6-way column split into one flowing column */
    .phone-grid { grid-template-columns: 1fr; }

    .room-card, .add-room-btn { width: 118px; }
  }

  @media (max-width: 640px) {
    main { padding: 10px; }
    header { padding: 8px 10px; }
    .school-name { font-size: 13px; }
    td { padding: 8px 8px; font-size: 13px; }
    th { font-size: 12px; }

    .toolbar { gap: 8px; }
    .toolbar-btn { padding: 8px 12px; font-size: 13px; }
    .search-wrap { min-width: 100%; }

    /* Larger tap targets for the tab pills */
    .tab { padding: 6px 12px; font-size: 13px; }
    .year-badge { padding: 4px 10px; font-size: 12px; }

    /* Icon-only action buttons to save horizontal space */
    .header-search-btn { padding: 6px 10px; gap: 0; }
    .header-search-btn svg { width: 15px; height: 15px; }
    .header-search-btn .btn-label { display: none; }

    #edit-btn { padding: 6px 12px; font-size: 13px; }

    .modal { width: 100%; padding: 18px; }
    .modal-actions { flex-wrap: wrap; }
    .modal-actions button { flex: 1; min-width: 90px; }

    .room-card, .add-room-btn { width: 46%; flex: 1 1 46%; }
    .rooms-grid { gap: 6px; }

    #edit-bar { flex-wrap: wrap; padding: 8px 12px; font-size: 12px; }
    #edit-bar .save-btn, #edit-bar .discard-btn { padding: 6px 12px; }
  }

  @media (max-width: 420px) {
    .school-name { font-size: 12px; }
    .year-badge span:first-child { font-size: 11px; }
    .header-search-btn { padding: 6px 8px; }
    .room-card, .add-room-btn { width: 100%; flex: 1 1 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-left">
      <div class="school-name">新莊國小電話與地圖</div>
      <div class="year-badge" id="year-toggle" onclick="toggleYearPicker()">
        <span id="current-year-label">114學年度</span>
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <!-- Year picker dropdown (anchored to this badge) -->
        <div class="year-dropdown" id="year-dropdown" onclick="event.stopPropagation()">
          <div id="year-list"></div>
          <div class="year-new">
            <div class="year-option" onclick="newYear()">＋ 建立新學年</div>
          </div>
        </div>
      </div>
      <div class="tab active" onclick="switchTab('phone', this)" id="tab-phone">
        <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 2h3l1.5 3-2 1.5a9 9 0 003 3L10 8l3 1.5V13a1 1 0 01-1 1C5 14 1 10 1 4a1 1 0 011-1z"/></svg>
        分機一覽
      </div>
      <div class="tab" onclick="switchTab('map', this)" id="tab-map">
        <svg width="13" height="13" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1" y="1" width="13" height="13" rx="1.5"/><path d="M1 5h13M5 5v9"/></svg>
        場地配置
      </div>
      <div class="tab-legend" id="tab-legend-phone">
        <span>編輯模式下點擊 # 欄位可標記／取消 ★ 學年主任</span>
      </div>
      <div class="tab-legend" id="tab-legend-map" style="display:none">
        <span><span class="dot" style="background:#f0f5fa;border:1.5px solid #1a5c8a"></span>班級</span>
        <span><span class="dot" style="background:#fdf3ec;border:1.5px solid #e07b39"></span>辦公室</span>
        <span><span class="dot" style="background:#eef7f2;border:1.5px solid #2e7d52"></span>特殊</span>
        <span><span class="dot" style="background:#f3f0fa;border:1.5px solid #7c5cbf"></span>其他</span>
      </div>
    </div>
    <div class="header-search" id="header-search-area">
      <div class="header-search-wrap">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l3 3"/></svg>
        <input class="header-search-input" type="text" placeholder="搜尋姓名、職稱或分機號碼…" id="phone-search" oninput="filterPhone()">
      </div>
      <button class="header-search-btn" onclick="window.print()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="5" width="12" height="8" rx="1"/><path d="M5 5V2h6v3M5 12h6"/></svg>
        <span class="btn-label">列印</span>
      </button>
      <button class="header-search-btn" onclick="exportExcel()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6L9 2z"/><path d="M9 2v4h4M6 9l4 4M10 9l-4 4"/></svg>
        <span class="btn-label">下載 Excel</span>
      </button>
      <button class="header-search-btn" onclick="exportJSON()" title="匯出資料為 JSON">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6L9 2z"/><path d="M9 2v4h4"/><path d="M5 10h6M5 12.5h4"/></svg>
        <span class="btn-label">匯出 JSON</span>
      </button>
      <label class="header-search-btn" style="cursor:pointer" title="匯入 JSON 覆蓋資料">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 2H4a1 1 0 00-1 1v10a1 1 0 001 1h8a1 1 0 001-1V6L9 2z"/><path d="M9 2v4h4"/><path d="M8 14V8m-2.5 3.5L8 14l2.5-2.5"/></svg>
        <span class="btn-label">匯入 JSON</span>
        <input type="file" accept=".json" onchange="importJSON(event)" style="display:none">
      </label>
    </div>
    <div class="header-right">
      <button id="edit-btn" onclick="toggleEdit()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M11 2L14 5L6 13H3V10L11 2Z"/>
        </svg>
        <span id="edit-label">編輯</span>
      </button>
    </div>
  </div>
</header>

<!-- Edit mode bar -->

  <div class="tab-panel active" id="panel-phone">
    <div class="phone-table-wrap">

        </div>
        <div class="phone-col" id="phone-col-1">
          <table><thead><tr><th title="點擊切換★學年主任">#</th><th>職稱</th><th>姓名</th><th>分機</th></tr></thead><tbody id="phone-tbody-1"></tbody></table>
        </div>
        <div class="phone-col" id="phone-col-2">
          <table><thead><tr><th title="點擊切換★學年主任">#</th><th>職稱</th><th>姓名</th><th>分機</th></tr></thead><tbody id="phone-tbody-2"></tbody></table>
        </div>

        </div>
        <div class="phone-col" id="phone-col-4">

        </div>
        <div class="phone-col" id="phone-col-5">
          <table><thead><tr><th title="點擊切換★學年主任">#</th><th>職稱</th><th>姓名</th><th>分機</th></tr></thead><tbody id="phone-tbody-5"></tbody></table>

      <input type="text" id="modal-ext" placeholder="例：213">

// ─── Category mapping ─────────────────────────────────────
const CAT_ORDER = [
  { key: 'admin', label: '行政主管', cssClass: 'cat-admin', match: t => ['校　　長','教務主任','學務主任','總務主任','輔導主任','會計主任','人事主任'].includes(t) },
